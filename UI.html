<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .btn-arabic {
            background-color: #2b2b2b;
            color: white;
        }

        .btn-arabic:hover {
            background-color: #1a1a1a;
            transform: translateY(-2px);
        }

        .btn-english {
            background-color: #ffffff;
            color: #2b2b2b;
            border: 2px solid #2b2b2b;
        }

        .btn-english:hover {
            background-color: #2b2b2b;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="Officestyle.html" class="btn btn-arabic">عربي</a>
        <a href="OfficestyleEN.html" class="btn btn-english">English</a>
    </div>

</body>
</html>
